# Cloud Build pipeline for mighty-colab.
# Trigger: GitHub push to refs/tags/v* on danbarua/mighty-colab (main).

substitutions:
  _AR_LOCATION: us-central1
  _AR_REPOSITORY: python-repo
  # PROJECT_ID is automatically populated by Cloud Build

steps:
  # 1. Ensure hatch-vcs sees the tag.
  - id: show-version
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        git fetch --tags --force --unshallow 2>/dev/null || git fetch --tags --force
        echo "TAG_NAME=${TAG_NAME}"
        echo "git describe: $(git describe --tags --always)"

  # 2. Build sdist + wheel into dist/ using uv.
  - id: build
    name: ghcr.io/astral-sh/uv:python3.13-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        uv build
        ls -la dist/

  # 3. Publish artifacts directly to YOUR Artifact Registry repository.
  - id: publish-to-ar
    name: python:3.13-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --quiet --root-user-action=ignore \
          twine keyrings.google-artifactregistry-auth
        twine upload \
          --repository-url "https://${_AR_LOCATION}-python.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/" \
          --verbose \
          dist/*

# Surface the built artifacts in the Cloud Build UI.
artifacts:
  objects:
    location: gs://${PROJECT_ID}_cloudbuild/artifacts/${TAG_NAME}
    paths:
      - dist/*

options:
  logging: CLOUD_LOGGING_ONLY
  # Required to allow twine to use the service account credentials
  requestedVerifyOption: VERIFIED
