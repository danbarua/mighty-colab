name: Claude PR Review

# Agent mode (`prompt:` is set). Not @claude tag mode, which prepends
# git commit/push and CI log tools.
#
# No `synchronize`: #329 had 46 commits. Deliberate rerun is a PR
# comment containing `@claude review` (static prompt below, so still
# agent mode). Tag jobs in claude.yml skip that phrase.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Refuse a fork PR before checkout or install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cross=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json isCrossRepository --jq .isCrossRepository)
          test "$cross" = "false"

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head

      - uses: astral-sh/setup-uv@v6

      - name: Install the non-spendy test env
        run: uv sync --group dev

      - name: Review the PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_fix_links: false
          exclude_comments_by_actor: "claude[bot]"
          prompt: |
            Review PR #${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }}.

            Use `gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}` for the change.
            Do not implement, commit, or push.
            Do not re-read prior review comments; the diff is the input.
            Docs and reasoning under docs/ are product, not skippable.

            After reading the diff, run when they bear on a finding
            (already installed; spendy e2e tests skip themselves):
              uv run ruff check
              uv run basedpyright src/ tests/
            If the diff touches cloud/, also:
              cd cloud && uv run --with basedpyright basedpyright .
            For pytest, run only the files or tests that the finding names:
              uv run python -m pytest tests/<file>
              cd cloud && uv run --with pytest --with jsonschema python -m pytest tests/<file>
            Do not run the full suite; CI already does. If a command cannot
            run, say so and label that finding a hypothesis.

            Post the review with `gh pr comment`. Findings first, with file paths.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 10
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(uv run ruff check:*),Bash(uv run basedpyright:*),Bash(uv run python -m pytest:*),Bash(cd cloud && uv run --with basedpyright basedpyright:*),Bash(cd cloud && uv run --with pytest --with jsonschema python -m pytest:*)"
            --disallowedTools "Edit,Write,NotebookEditCell,WebSearch,WebFetch,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rm:*)"
            --strict-mcp-config
